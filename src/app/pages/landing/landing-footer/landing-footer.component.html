<footer>
  <div class="container">
    <div class="brand">
      <a routerLink="/" queryParamsHandling="preserve">
        <h3>TNT</h3>
      </a>
      <p class="tagline">Sign language translation, in the browser.</p>
      <a [href]="repositoryUrl" target="_blank" rel="noopener">Source on GitHub</a>
      <!-- Language selector is disabled until better support is added
      <br />
      <app-i18n-language-selector /> -->
    </div>

    <div class="legal" *transloco="let t; read: 'legal'">
      <h3>{{ t('title') }}</h3>
      <ul>
        @for (page of legalPages; track page) {
          <li>
            <a [routerLink]="['/legal', page]" queryParamsHandling="preserve">
              {{ t(page + '.title') }}
            </a>
          </li>
        }
      </ul>
    </div>

    <div class="social">
      <h3>{{ 'landing.community.title' | transloco }}</h3>
      <ul>
        <li><a [href]="repositoryUrl" target="_blank" rel="noopener">GitHub</a></li>
        <li><a [href]="issuesUrl" target="_blank" rel="noopener">Report an issue</a></li>
        <li><a routerLink="/about/contribute" queryParamsHandling="preserve">Contribute</a></li>
      </ul>
    </div>
  </div>
</footer>
