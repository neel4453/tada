<ng-container *transloco="let t; read: 'settings.support.feedback'">
  <ion-header class="ion-no-border floating-header">
    <div class="nav-inner">
      <ion-back-button />
      <span class="nav-title">{{ t('title') }}</span>
    </div>
  </ion-header>
  <ion-content [fullscreen]="true" id="main-content">
    <ion-list>
      <ion-item [href]="issuesUrl" target="_blank" rel="noopener">
        <ion-label>{{ t('send') }}</ion-label>
      </ion-item>
      <!-- TODO rate on app/play store depending on the platform -->
    </ion-list>
  </ion-content>
</ng-container>
