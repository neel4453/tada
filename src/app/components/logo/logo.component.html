<span class="logo-content">

      fill="none"
      role="img"
      aria-label="TNT"
      xmlns="http://www.w3.org/2000/svg"
      class="logo-mark">

        <linearGradient id="tntLogoTile" x1="8" y1="3" x2="92" y2="97" gradientUnits="userSpaceOnUse">

          <stop offset="0.52" stop-color="#FF882B" />
